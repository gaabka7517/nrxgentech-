<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360" fill="none">
  <!-- NexGen Official Standalone Logo (Exact Replica of WhatsApp Brand Mark) -->
  
  <g id="emblem-group" transform="translate(10, 10)">
    <!-- Stylized Laptop Screen in NexGen Green -->
    <rect
      x="40"
      y="70"
      width="220"
      height="130"
      rx="12"
      fill="#FFFFFF"
      stroke="#5ACB00"
      stroke-width="7"
    />

    <!-- Inner Screen Border Line -->
    <rect
      x="48"
      y="78"
      width="204"
      height="114"
      rx="6"
      fill="none"
      stroke="#5ACB00"
      stroke-width="1.8"
      opacity="0.85"
    />

    <!-- Screen Landscape / Hills in NexGen Green -->
    <path
      d="M 50 160 Q 100 130 160 150 Q 210 165 250 140 L 250 190 L 50 190 Z"
      fill="#5ACB00"
      opacity="0.95"
    />
    <path
      d="M 120 170 Q 170 145 250 160 L 250 190 L 120 190 Z"
      fill="#48A800"
    />

    <!-- Laptop Base: Left blue section, Right green section -->
    <path
      d="M 15 200 L 150 200 L 150 216 L 25 216 Z"
      fill="#075A91"
    />
    <path
      d="M 150 200 L 285 200 L 275 216 L 150 216 Z"
      fill="#5ACB00"
    />
    <!-- Power / Notch slot on right base -->
    <rect x="180" y="204" width="38" height="4" rx="2" fill="#FFFFFF" opacity="0.9" />

    <!-- Open Book in Center on Screen -->
    <g id="open-book">
      <!-- Left Page (Green) -->
      <path
        d="M 148 75 C 130 75 110 85 102 120 L 102 165 C 110 135 130 128 148 128 Z"
        fill="#5ACB00"
      />
      <!-- Right Page (Green Base) -->
      <path
        d="M 152 75 C 170 75 190 85 198 120 L 198 165 C 190 135 170 128 152 128 Z"
        fill="#5ACB00"
      />
      <!-- Turning White and Blue Layered Leaves -->
      <path
        d="M 152 75 C 165 77 180 87 186 112 L 178 112 C 172 92 160 82 152 80 Z"
        fill="#FFFFFF"
      />
      <path
        d="M 156 88 C 168 90 182 100 188 122 L 181 122 C 175 104 165 95 156 93 Z"
        fill="#075A91"
      />
      <path
        d="M 160 102 C 171 104 184 114 190 134 L 183 134 C 178 118 168 110 160 107 Z"
        fill="#FFFFFF"
      />
    </g>

    <!-- Digital Brain Network above Book -->
    <g id="brain-nodes">
      <!-- Green Brain Contour -->
      <path
        d="M 125 45 C 112 45 104 53 104 62 C 95 65 95 75 103 79 C 103 88 116 92 129 88 C 135 96 150 96 155 84 C 158 75 151 58 142 51 C 138 46 132 45 125 45 Z"
        fill="#FFFFFF"
        stroke="#5ACB00"
        stroke-width="5"
        stroke-linecap="round"
      />
      <!-- Brain Circuit Lines and Nodes in Blue -->
      <line x1="120" y1="65" x2="140" y2="65" stroke="#075A91" stroke-width="3.5" />
      <line x1="130" y1="65" x2="130" y2="85" stroke="#5ACB00" stroke-width="3.5" />
      <circle cx="118" cy="56" r="5.5" fill="#075A91" />
      <circle cx="140" cy="58" r="5" fill="#075A91" />
      <circle cx="130" cy="72" r="4" fill="#5ACB00" />
      <circle cx="144" cy="75" r="4.5" fill="#075A91" />
    </g>

    <!-- Dynamic Blue Swoosh Arc (Sweeping from top-left curving under the laptop) -->
    <path
      d="M 52 10 C 26 65 14 150 110 238 C 160 284 240 240 288 205 C 235 248 155 244 105 198 C 58 152 50 82 72 10 Z"
      fill="#075A91"
    />
  </g>

  <!-- NexGen Official Typography (Exact Colors & Fonts) -->
  <g id="brand-text">
    <text
      x="160"
      y="285"
      text-anchor="middle"
      font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
      font-weight="900"
      font-size="52"
      fill="#5ACB00"
      letter-spacing="-1.5"
    >
      NexGen
    </text>
    <text
      x="160"
      y="320"
      text-anchor="middle"
      font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
      font-weight="700"
      font-size="24"
      fill="#075A91"
      letter-spacing="0.5"
    >
      Technologies
    </text>
  </g>
</svg>
